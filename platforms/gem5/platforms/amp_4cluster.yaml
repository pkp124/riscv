# AMP platform: 4 heterogeneous clusters
platform:
  name: amp_4cluster
  description: "4-cluster AMP: scalar, scalar, RVV, scalar monitor"

  simulation:
    clock: 1GHz
    mem_mode: timing
    max_ticks: 10000000000

  clusters:
    - name: cluster0
      role: application
      isa: rv64gc
      harts: 1
      cpu_type: TimingSimpleCPU
      l1i_size: 32kB
      l1d_size: 32kB
      l2_size: 128kB
      scratchpad:
        name: sram0
        base: 0x20000000
        size: 0x10000
        latency_ns: 2

    - name: cluster1
      role: application
      isa: rv64gc
      harts: 1
      cpu_type: TimingSimpleCPU
      l1i_size: 16kB
      l1d_size: 16kB
      l2_size: 128kB
      scratchpad:
        name: sram1
        base: 0x21000000
        size: 0x10000
        latency_ns: 2

    - name: cluster2
      role: accelerator
      isa: rv64gcv
      vlen: 256
      harts: 2
      cpu_type: MinorCPU
      l1i_size: 32kB
      l1d_size: 32kB
      l2_size: 512kB
      scratchpad:
        name: sram2
        base: 0x22000000
        size: 0x20000
        latency_ns: 2

    - name: cluster3
      role: monitor
      isa: rv64gc
      harts: 1
      cpu_type: AtomicSimpleCPU
      l1i_size: 8kB
      l1d_size: 8kB
      l2_size: 64kB
      scratchpad:
        name: sram3
        base: 0x23000000
        size: 0x10000
        latency_ns: 2

  shared_memory:
    - name: shared_sram
      base: 0x30000000
      size: 0x80000
      latency_ns: 5
      kind: sram

    - name: dram
      base: 0x80000000
      size: 0x8000000
      kind: ddr4

  peripherals:
    - type: uart8250
      name: uart0
      base: 0x10000000
    - type: clint
      name: clint0
      base: 0x02000000
    - type: plic
      name: plic0
      base: 0x0C000000
